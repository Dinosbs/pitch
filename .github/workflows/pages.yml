# Veröffentlicht die Pitch-Präsentation auf GitHub Pages:
#   https://dinosbs.github.io/pitch/          leitet weiter auf /pitch/beauty/ (index.html)
#   https://dinosbs.github.io/pitch/<slug>/   je Fassung (pitches/<slug>/index.html, aus data/pitches.json): beauty, ariel61, yelizkoc
# Einmalig nötig (erledigt): Repository → Settings → Pages → Source: „GitHub Actions“.
name: Pitch auf GitHub Pages veröffentlichen

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # index.html und pitches/<slug>/index.html frisch aus src/ + data/ + assets/ bauen (nur Python-Standardbibliothek)
      - name: Präsentation bauen
        run: python3 build.py
      # Veröffentlicht werden nur die fertigen, eigenständigen Seiten – nicht die Rohdaten
      - name: Seiten bereitstellen
        run: |
          shopt -s nullglob
          mkdir _site
          cp index.html _site/index.html
          cp assets/ui/incent-favicon.png _site/favicon.png
          for d in pitches/*/; do
            slug=$(basename "$d")
            mkdir -p "_site/$slug"
            cp "$d/index.html" "_site/$slug/index.html"
            echo "/$slug/"
          done
          for f in _site/index.html _site/*/index.html; do
            grep -q '<meta name="robots" content="noindex, nofollow">' "$f" || { echo "ohne noindex: $f"; exit 1; }
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
